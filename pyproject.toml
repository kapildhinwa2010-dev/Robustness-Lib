[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robustness_lib"
version = "0.1.0"
description = "Robustness-Lib - Robustness library: measure compression stability under noise"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
